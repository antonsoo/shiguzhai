name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to the existing Pages branch
        run: |
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/shiguzhai-pages" FETCH_HEAD
          rsync -a --delete --exclude=.git dist/ "$RUNNER_TEMP/shiguzhai-pages/"
          cd "$RUNNER_TEMP/shiguzhai-pages"
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
