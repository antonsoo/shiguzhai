name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 scripts/source-oracle.py
      - run: npx playwright install --with-deps chromium firefox
      - run: node scripts/browser-review.mjs /tmp/shiguzhai-review/browser.json
      - run: python3 scripts/rendered-oracle.py /tmp/shiguzhai-review/browser.json
      - run: python3 scripts/audio-oracle.py /tmp/shiguzhai-review/browser.json
